<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#13192b" />
      <stop offset="100%" stop-color="#17132a" />
    </linearGradient>

    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="barRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <linearGradient id="barEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <filter id="barGlow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hud-font {
      font-family: 'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace;
    }
    .jp-font {
      font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
    }
    .bar-anim-1 { animation: fillBar1 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bar-anim-2 { animation: fillBar2 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bar-anim-3 { animation: fillBar3 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bar-anim-4 { animation: fillBar4 2.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .bar-anim-5 { animation: fillBar5 3.0s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .pulse-dot { animation: blink 2s ease-in-out infinite; }
    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Main Card Frame -->
  <rect width="1000" height="410" rx="16" fill="url(#cardBg)" />
  <rect x="10" y="10" width="980" height="390" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />
  <rect x="16" y="16" width="968" height="378" rx="9" fill="none" stroke="#67e8f9" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Top Header Banner inside Card -->
  <rect x="16" y="16" width="968" height="46" rx="9" fill="#1e1b4b" fill-opacity="0.7" />
  <line x1="16" y1="62" x2="984" y2="62" stroke="#67e8f9" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="42" cy="39" r="6" fill="#67e8f9" class="pulse-dot" />
  <text x="60" y="44" fill="#67e8f9" font-size="15" font-weight="bold" class="hud-font" letter-spacing="2">
    『 冒険者ギルドカード 』 // ADVENTURER STATUS &amp; ATTRIBUTE MATRIX
  </text>
  <text x="960" y="44" fill="#facc15" font-size="13" font-weight="bold" text-anchor="end" class="hud-font">
    RANK: SS-CLASS MAGE ✦
  </text>

  <!-- Left Column: Character Dossier -->
  <g transform="translate(34, 82)">
    <rect x="0" y="0" width="430" height="302" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#475569" stroke-width="1" />
    
    <!-- Section Title -->
    <rect x="16" y="16" width="398" height="32" rx="6" fill="#1e293b" />
    <text x="28" y="37" fill="#c084fc" font-size="13" font-weight="bold" class="hud-font">
      🪪 CHARACTER DOSSIER // 人物情報
    </text>

    <!-- Dossier Rows -->
    <text x="24" y="74" fill="#94a3b8" font-size="12.5" class="hud-font">▸ NAME / 名前</text>
    <text x="185" y="74" fill="#f8fafc" font-size="13" font-weight="bold" class="hud-font">Fahrizal Amanda (Frieren)</text>
    <line x1="24" y1="84" x2="406" y2="84" stroke="#1e293b" stroke-width="1" />

    <text x="24" y="108" fill="#94a3b8" font-size="12.5" class="hud-font">▸ ALIAS / 二つ名</text>
    <text x="185" y="108" fill="#67e8f9" font-size="13" font-weight="bold" class="hud-font">Yutsuri Hisekawa (久世川)</text>
    <line x1="24" y1="118" x2="406" y2="118" stroke="#1e293b" stroke-width="1" />

    <text x="24" y="142" fill="#94a3b8" font-size="12.5" class="hud-font">▸ CLASS / 職業</text>
    <text x="185" y="142" fill="#facc15" font-size="13" font-weight="bold" class="hud-font">Fullstack &amp; Mobile Engineer</text>
    <line x1="24" y1="152" x2="406" y2="152" stroke="#1e293b" stroke-width="1" />

    <text x="24" y="176" fill="#94a3b8" font-size="12.5" class="hud-font">▸ GUILD / 所属</text>
    <text x="185" y="176" fill="#f472b6" font-size="13" font-weight="bold" class="hud-font">Mitra Visual Group (MVG)</text>
    <line x1="24" y1="186" x2="406" y2="186" stroke="#1e293b" stroke-width="1" />

    <text x="24" y="210" fill="#94a3b8" font-size="12.5" class="hud-font">▸ REALM / 拠点</text>
    <text x="185" y="210" fill="#e2e8f0" font-size="13" class="hud-font">Somewhere Beyond Time (ID)</text>
    <line x1="24" y1="220" x2="406" y2="220" stroke="#1e293b" stroke-width="1" />

    <text x="24" y="244" fill="#94a3b8" font-size="12.5" class="hud-font">▸ QUEST / 使命</text>
    <text x="185" y="244" fill="#6ee7b7" font-size="12.5" class="hud-font">Scalable Web &amp; Mobile Apps</text>
    <line x1="24" y1="254" x2="406" y2="254" stroke="#1e293b" stroke-width="1" />

    <!-- HP / MP Badges -->
    <rect x="24" y="264" width="182" height="24" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
    <text x="115" y="280" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle" class="hud-font">
      HP: 9,999 / 9,999 [MAX]
    </text>

    <rect x="220" y="264" width="186" height="24" rx="5" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="313" y="280" fill="#c4b5fd" font-size="11" font-weight="bold" text-anchor="middle" class="hud-font">
      MP: ∞ MANA (CAFFEINE)
    </text>
  </g>

  <!-- Right Column: Combat / Magic Skill Bars -->
  <g transform="translate(484, 82)">
    <rect x="0" y="0" width="482" height="302" rx="10" fill="#0f172a" fill-opacity="0.75" stroke="#475569" stroke-width="1" />

    <!-- Section Title -->
    <rect x="16" y="16" width="450" height="32" rx="6" fill="#1e293b" />
    <text x="28" y="37" fill="#67e8f9" font-size="13" font-weight="bold" class="hud-font">
      ⚡ ARCANE PROFICIENCY // 魔導スキル熟練度
    </text>

    <!-- Skill 1: Frontend -->
    <text x="24" y="72" fill="#e2e8f0" font-size="12" font-weight="bold" class="hud-font">
      🌸 前衛魔法 • Frontend (Vue.js / Nuxt / TS / Tailwind)
    </text>
    <text x="458" y="72" fill="#67e8f9" font-size="12" font-weight="bold" text-anchor="end" class="hud-font">95% [SS]</text>
    <rect x="24" y="80" width="434" height="12" rx="6" fill="#1e293b" />
    <rect x="24" y="80" width="412" height="12" rx="6" fill="url(#barCyan)" filter="url(#barGlow)" />

    <!-- Skill 2: Backend -->
    <text x="24" y="118" fill="#e2e8f0" font-size="12" font-weight="bold" class="hud-font">
      ⚔️ 後衛魔法 • Backend (Laravel / PHP / Node / Express)
    </text>
    <text x="458" y="118" fill="#e879f9" font-size="12" font-weight="bold" text-anchor="end" class="hud-font">92% [SS]</text>
    <rect x="24" y="126" width="434" height="12" rx="6" fill="#1e293b" />
    <rect x="24" y="126" width="399" height="12" rx="6" fill="url(#barPurple)" filter="url(#barGlow)" />

    <!-- Skill 3: Mobile -->
    <text x="24" y="164" fill="#e2e8f0" font-size="12" font-weight="bold" class="hud-font">
      📱 召喚魔法 • Mobile Apps (Flutter / Dart / iOS &amp; Android)
    </text>
    <text x="458" y="164" fill="#fde047" font-size="12" font-weight="bold" text-anchor="end" class="hud-font">88% [S+]</text>
    <rect x="24" y="172" width="434" height="12" rx="6" fill="#1e293b" />
    <rect x="24" y="172" width="382" height="12" rx="6" fill="url(#barGold)" filter="url(#barGlow)" />

    <!-- Skill 4: Database & Architecture -->
    <text x="24" y="210" fill="#e2e8f0" font-size="12" font-weight="bold" class="hud-font">
      🗄️ 記憶魔導書 • Database &amp; API (PostgreSQL / MySQL / REST)
    </text>
    <text x="458" y="210" fill="#fda4af" font-size="12" font-weight="bold" text-anchor="end" class="hud-font">90% [S+]</text>
    <rect x="24" y="218" width="434" height="12" rx="6" fill="#1e293b" />
    <rect x="24" y="218" width="390" height="12" rx="6" fill="url(#barRose)" filter="url(#barGlow)" />

    <!-- Skill 5: Clean Code & UI/UX -->
    <text x="24" y="256" fill="#e2e8f0" font-size="12" font-weight="bold" class="hud-font">
      ✨ 結界術式 • System Design, Clean Code &amp; DevOps
    </text>
    <text x="458" y="256" fill="#6ee7b7" font-size="12" font-weight="bold" text-anchor="end" class="hud-font">94% [SS]</text>
    <rect x="24" y="264" width="434" height="12" rx="6" fill="#1e293b" />
    <rect x="24" y="264" width="408" height="12" rx="6" fill="url(#barEmerald)" filter="url(#barGlow)" />
  </g>
</svg>
